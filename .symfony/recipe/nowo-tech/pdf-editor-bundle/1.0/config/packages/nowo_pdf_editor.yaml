nowo_pdf_editor:
    default_profile: default
    profiles:
        default:
            python_binary: python3
            engine_script: '%kernel.project_dir%/vendor/nowo-tech/pdf-editor-bundle/engine/pdf_editor_engine.py'
            workspace_dir: '%kernel.project_dir%/var/pdf-editor'
            timeout: 60
            idle_timeout: 30
    # web_ui:
    #     layout_template: null   # null = nowo_ui_kit.layouts.admin (set that once to your layout or bridge)
    security:
        access_roles: [ROLE_ADMIN]
        # access_checker: App\Security\PdfEditorAccessChecker
        allow_unauthenticated: false   # dev/demo only; refused in prod
