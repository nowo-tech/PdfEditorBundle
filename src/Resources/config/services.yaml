services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\PdfEditorBundle\Engine\SymfonyProcessRunner: ~
    nowo_pdf_editor.process_runner:
        alias: Nowo\PdfEditorBundle\Engine\SymfonyProcessRunner

    Nowo\PdfEditorBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../PdfEditorBundle.php'
            - '../../NowoPdfEditorBundle.php'
            - '../../View/'
            - '../../Resources/'
            - '../../Config/'
            - '../../Exception/'
            - '../../Document/Workspace.php'
            - '../../Engine/ProcessOutcome.php'
            - '../../Operation/EditorOperation.php'

    Nowo\PdfEditorBundle\Security\WorkspaceOwnerResolverInterface:
        alias: Nowo\PdfEditorBundle\Security\WorkspaceOwnerResolver

    Nowo\PdfEditorBundle\Operation\OperationDecoder: ~
    Nowo\PdfEditorBundle\Form\PdfUploadType: ~

    # Not autoconfigured: since Symfony 7.3 autoconfiguration tags #[Route] classes `routing.controller`, and the
    # host's default `routing.controllers` import would load the editor routes without the opt-in
    # @NowoPdfEditorBundle/Resources/config/routing.yaml import (prefix / when@ guards). Only the controller
    # argument resolver tag is set, explicitly.
    Nowo\PdfEditorBundle\Controller\EditorController:
        autoconfigure: false
        tags: ['controller.service_arguments']
        arguments:
            $layoutTemplate: '%nowo_pdf_editor.web_ui.layout_template%'
            $templates: '%nowo_pdf_editor.web_ui.templates%'

    Nowo\PdfEditorBundle\Command\CheckEngineCommand: ~
    Nowo\PdfEditorBundle\Command\PurgeWorkspacesCommand: ~
