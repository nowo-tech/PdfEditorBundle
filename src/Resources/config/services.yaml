services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Nowo\PdfEditorBundle\Engine\SymfonyProcessRunner: ~
    nowo_pdf_editor.process_runner:
        alias: Nowo\PdfEditorBundle\Engine\SymfonyProcessRunner

    Nowo\PdfEditorBundle\:
        resource: '../../*'
        exclude:
            - '../../DependencyInjection/'
            - '../../PdfEditorBundle.php'
            - '../../Resources/'
            - '../../Config/'
            - '../../Exception/'
            - '../../Document/Workspace.php'
            - '../../Engine/ProcessOutcome.php'
            - '../../Operation/EditorOperation.php'

    Nowo\PdfEditorBundle\Security\WorkspaceOwnerResolverInterface:
        alias: Nowo\PdfEditorBundle\Security\WorkspaceOwnerResolver

    Nowo\PdfEditorBundle\Operation\OperationDecoder: ~
    Nowo\PdfEditorBundle\Form\PdfUploadType: ~

    # #[AsController] + autoconfigure tag it controller.service_arguments (REQ-SF-003).
    Nowo\PdfEditorBundle\Controller\EditorController: ~

    Nowo\PdfEditorBundle\Command\CheckEngineCommand: ~
    Nowo\PdfEditorBundle\Command\PurgeWorkspacesCommand: ~
