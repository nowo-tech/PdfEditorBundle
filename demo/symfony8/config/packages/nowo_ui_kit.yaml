# UiKit host setup of the demo (REQ-DEMO-014 / REQ-UI-003): UiKit's default theme, unchanged (no token overrides), with
# UiKit's own semantic nowo-ui-* styles only (css_framework: custom: no CSS framework, no CDN). The editor pages render
# in the demo shell (base.html.twig extends UiKit's admin layout).
nowo_ui_kit:
    css_framework: custom
    layouts:
        admin: 'base.html.twig'
