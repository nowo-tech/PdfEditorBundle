nowo_pdf_editor:
    default_profile: default
    profiles:
        default:
            python_binary: python3
            engine_script: /var/pdf-editor-bundle/engine/pdf_editor_engine.py
            workspace_dir: '%kernel.project_dir%/var/pdf-editor'
            timeout: 60
            idle_timeout: 30
            max_upload_bytes: 26214400
            render_dpi: 144
            engine_mode: client
    # web_ui.layout_template stays null: the pages use nowo_ui_kit.layouts.admin (config/packages/nowo_ui_kit.yaml).
    security:
        access_roles: [ROLE_ADMIN]
        # Demo only (no login in this demo); refused in prod / non-debug kernels (see when@prod below).
        allow_unauthenticated: true

# Production mode (DEMO-FRANKENPHP): allow_unauthenticated is refused outside dev/test, so the editor needs a role.
when@prod:
    nowo_pdf_editor:
        security:
            allow_unauthenticated: false
