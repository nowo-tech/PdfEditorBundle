                    "rector process"
                ],
                "rector-dry": [
                    "rector process --dry-run --no-progress-bar"
                ],
                "phpstan": [
                    "phpstan analyse --memory-limit=512M"
                ],
                "qa": [
                    "@cs-check",
                    "@test"
                ]
